services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql://root:smartplanner2024@mysql:3306/smart_lesson_planner}
      - JWT_SECRET=${JWT_SECRET:-smart-lesson-planner-secret-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NODE_ENV=production
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - coolify
    restart: unless-stopped

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration-builder
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql://root:smartplanner2024@mysql:3306/smart_lesson_planner}
    command: npx prisma db push --accept-data-loss
    networks:
      - coolify
    restart: "no"

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-smartplanner2024}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-smart_lesson_planner}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD:-smartplanner2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:

networks:
  coolify:
    external: true
